plugins { id 'com.android.application' }

android {
    namespace 'com.lumavault.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lumavault.app'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
